  /* ==================================================
     HELPERS
  =================================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function normaliseAllergen(value) {

    value =
      String(value).toLowerCase();

    if (
      value === "tree nuts" ||
      value === "nut"
    ) {
      return "nuts";
    }

    return value;

  }


  function prettyAllergen(value) {

    var names = {
      gluten: "Gluten",
      egg: "Egg",
      milk: "Milk",
      soya: "Soya",
      sulphites: "Sulphites",
      nuts: "Nuts",
      peanuts: "Peanuts",
      mustard: "Mustard",
      fish: "Fish",
      celery: "Celery",
      barley: "Barley"
    };

    return names[value] || value;

  }


  /* ==================================================
     RENDER CATEGORY
  =================================================== */

  function renderCategory(entry) {

    return (
      '<div class="br6-category-heading">' +

        "<h2>" +
          escapeHTML(entry.title) +
        "</h2>" +

        (
          entry.text
            ?
            "<p>" +
              escapeHTML(entry.text) +
            "</p>"
            :
            ""
        ) +

      "</div>"
    );

  }


  /* ==================================================
     RENDER ITEM
  =================================================== */

  function renderItem(item) {

    var allergens =
      (item.allergens || []).map(
        normaliseAllergen
      );


    var html =
      '<article class="br6-item" ' +
      'data-allergens="' +
      escapeHTML(
        allergens.join("|")
      ) +
      '">';


    /* ITEM NAME */

    html +=
      '<h3 class="br6-item-name">' +
        escapeHTML(item.name) +
      "</h3>";


    /* SINGLE PRICE */

    if (item.price) {

      html +=
        '<span class="br6-price">' +
          escapeHTML(item.price) +
        "</span>";

    }


    /* MULTIPLE PRICES */

    if (
      item.prices &&
      item.prices.length
    ) {

      html +=
        '<div class="br6-price-options">';


      item.prices.forEach(
        function (option) {

          html +=
            '<div class="br6-price-option">' +

              "<span>" +
                escapeHTML(option.label) +
              "</span>" +

              '<strong class="br6-option-price">' +
                escapeHTML(option.price) +
              "</strong>" +

            "</div>";

        }
      );


      html +=
        "</div>";

    }


    /* DESCRIPTION */

    if (item.description) {

      html +=
        '<p class="br6-description">' +
          escapeHTML(item.description) +
        "</p>";

    }


    /* ADDONS */

    if (
      item.addons &&
      item.addons.length
    ) {

      html +=
        '<div class="br6-addons">';


      item.addons.forEach(
        function (addon) {

          html +=
            '<div class="br6-addon">' +

              "<span>" +
                escapeHTML(addon.name) +
              "</span>" +

              "<strong>" +
                escapeHTML(addon.price) +
              "</strong>" +

            "</div>";

        }
      );


      html +=
        "</div>";

    }


    /* ALLERGEN LABELS */

    if (allergens.length) {

      html +=
        '<div class="br6-allergen-area">';


      html +=
        '<p class="br6-allergen-prefix">' +
          escapeHTML(
            item.allergenPrefix ||
            "Contains"
          ) +
        "</p>";


      html +=
        '<div class="br6-allergen-labels">';


      allergens.forEach(
        function (allergen) {

          html +=
            '<span class="br6-allergen-label">' +
              escapeHTML(
                prettyAllergen(allergen)
              ) +
            "</span>";

        }
      );


      html +=
        "</div>" +
        "</div>";

    }


    /* UNKNOWN ALLERGEN INFO */

    if (item.allergenNote) {

      html +=
        '<p class="br6-tbc-note">' +
          escapeHTML(item.allergenNote) +
        "</p>";

    }


    /* DIETARY / OTHER TAGS */

    if (
      item.tags &&
      item.tags.length
    ) {

      html +=
        '<div class="br6-dietary-tags">';


      item.tags.forEach(
        function (tag) {

          html +=
            '<span class="br6-dietary-tag">' +
              escapeHTML(tag) +
            "</span>";

        }
      );


      html +=
        "</div>";

    }


    html +=
      "</article>";


    return html;

  }


  /* ==================================================
     RENDER COMPLETE MENU
  =================================================== */

  Object.keys(menus).forEach(
    function (menuName, menuIndex) {

      var menu =
        menus[menuName];


      var panel =
        document.createElement(
          "section"
        );


      panel.className =
        "br6-menu-panel" +
        (
          menuIndex === 0
            ? " is-active"
            : ""
        );


      panel.setAttribute(
        "data-panel",
        menuName
      );


      if (menuIndex !== 0) {
        panel.hidden = true;
      }


      var html =
        '<div class="br6-section-heading">';


      if (menu.eyebrow) {

        html +=
          '<p class="br6-eyebrow">' +
            escapeHTML(menu.eyebrow) +
          "</p>";

      }


      html +=
        "<h2>" +
          escapeHTML(menu.title) +
        "</h2>";


      if (menu.intro) {

        html +=
          "<p>" +
            escapeHTML(menu.intro) +
          "</p>";

      }


      html +=
        "</div>";


      menu.entries.forEach(
        function (entry) {

          if (
            entry.type ===
            "category"
          ) {

            html +=
              renderCategory(entry);

          } else {

            html +=
              renderItem(entry);

          }

        }
      );


      html +=
        '<div class="br6-no-results">' +
          "No dishes match your current allergen filters." +
        "</div>";


      panel.innerHTML =
        html;


      content.appendChild(
        panel
      );

    }
  );


  /* ==================================================
     MENU TABS
  =================================================== */

  var tabs =
    root.querySelectorAll(
      ".br6-menu-tab"
    );


  var panels =
    root.querySelectorAll(
      ".br6-menu-panel"
    );


  function showMenu(menuName) {

    tabs.forEach(
      function (tab) {

        var active =
          tab.getAttribute(
            "data-menu"
          ) === menuName;


        tab.classList.toggle(
          "is-active",
          active
        );


        tab.setAttribute(
          "aria-selected",
          active
            ? "true"
            : "false"
        );

      }
    );


    panels.forEach(
      function (panel) {

        var active =
          panel.getAttribute(
            "data-panel"
          ) === menuName;


        panel.classList.toggle(
          "is-active",
          active
        );


        panel.hidden =
          !active;

      }
    );


    applyFilters();


    requestAnimationFrame(
      sendHeight
    );

  }


  tabs.forEach(
    function (tab) {

      tab.addEventListener(
        "click",
        function () {

          showMenu(
            tab.getAttribute(
              "data-menu"
            )
          );

        }
      );

    }
  );


  /* ==================================================
     FILTER OPEN / CLOSE
  =================================================== */

  var filterToggle =
    document.getElementById(
      "br6-filter-toggle"
    );


  var filterPanel =
    document.getElementById(
      "br6-filter-panel"
    );


  filterToggle.addEventListener(
    "click",
    function () {

      var opening =
        filterPanel.hidden;


      filterPanel.hidden =
        !opening;


      filterToggle.setAttribute(
        "aria-expanded",
        opening
          ? "true"
          : "false"
      );


      filterToggle.textContent =
        opening
          ? "Close Allergen Filter"
          : "Filter Allergens";


      requestAnimationFrame(
        sendHeight
      );

    }
  );


  /* ==================================================
     ALLERGEN FILTERING
  =================================================== */

  var allergenInputs =
    root.querySelectorAll(
      ".br6-filter-option input"
    );


  function getSelectedAllergens() {

    var selected = [];


    allergenInputs.forEach(
      function (input) {

        if (input.checked) {

          selected.push(
            input.value
          );

        }

      }
    );


    return selected;

  }


  function applyFilters() {

    var selected =
      getSelectedAllergens();


    panels.forEach(
      function (panel) {

        var items =
          panel.querySelectorAll(
            ".br6-item"
          );


        var visibleCount = 0;


        items.forEach(
          function (item) {

            var allergens =
              (
                item.getAttribute(
                  "data-allergens"
                ) || ""
              )
              .split("|")
              .filter(Boolean);


            var blocked =
              selected.some(
                function (selectedAllergen) {

                  return (
                    allergens.indexOf(
                      selectedAllergen
                    ) !== -1
                  );

                }
              );


            item.style.display =
              blocked
                ? "none"
                : "";


            if (!blocked) {
              visibleCount++;
            }

          }
        );


        var noResults =
          panel.querySelector(
            ".br6-no-results"
          );


        if (noResults) {

          noResults.classList.toggle(
            "is-visible",
            visibleCount === 0
          );

        }

      }
    );


    requestAnimationFrame(
      sendHeight
    );

  }


  allergenInputs.forEach(
    function (input) {

      input.addEventListener(
        "change",
        applyFilters
      );

    }
  );


  /* ==================================================
     CLEAR FILTERS
  =================================================== */

  var clearFilters =
    document.getElementById(
      "br6-clear-filters"
    );


  clearFilters.addEventListener(
    "click",
    function () {

      allergenInputs.forEach(
        function (input) {

          input.checked =
            false;

        }
      );


      applyFilters();

    }
  );


  /* ==================================================
     ORIGINAL WORKING IFRAME AUTO HEIGHT
  =================================================== */

  function sendHeight() {

    var height =
      Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        root.scrollHeight
      );


    window.parent.postMessage(
      {
        type:
          "br6-menu-resize",

        height:
          height
      },
      "*"
    );

  }


  window.addEventListener(
    "load",
    sendHeight
  );


  window.addEventListener(
    "resize",
    sendHeight
  );


  if (
    "ResizeObserver" in window
  ) {

    var observer =
      new ResizeObserver(
        function () {
          sendHeight();
        }
      );


    observer.observe(
      root
    );

  }


  setTimeout(
    sendHeight,
    100
  );


  setTimeout(
    sendHeight,
    500
  );


  setTimeout(
    sendHeight,
    1200
  );


})();

</script>
